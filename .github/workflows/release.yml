name: Release

# When a GitHub Release is published (e.g. v1.2.3), move the floating major
# tag (v1) to the same commit so consumers pinning @v1 get the latest v1.x.x.
on:
  release:
    types: [published]

jobs:
  move-major-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not a vMAJOR.MINOR.PATCH semver tag."
            exit 1
          fi
          MAJOR="${TAG%%.*}"   # v1.2.3 -> v1
          echo "Pointing $MAJOR at $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG^{}"
          git push origin -f "refs/tags/$MAJOR"
