name: 'MobileBoost — Run Tests'
description: 'Trigger a test run on MobileBoost against an uploaded build.'
author: 'MobileBoost'
branding:
  icon: 'play-circle'
  color: 'purple'
inputs:
  api-key:
    description: 'MobileBoost API key (mb_live_…). Store as a GitHub secret.'
    required: true
  organisation-id:
    description: 'Your MobileBoost organisation ID.'
    required: true
  build-id:
    description: 'Build ID from the upload-build action output.'
    required: true
  mode:
    description: |
      Which kind of tests to run:
        gpt-driver (default) — AI-driven suites authored in the dashboard.
        ai-sdet              — generated test code from your org's test repo,
                               run on MobileBoost devices with AI self-healing.
                               Results are posted back to the PR the build came
                               from. Accepted as `autotest` too, its former
                               name.
    required: false
    default: 'gpt-driver'

  # Test selection — at least one of test-ids, tags, or tags-query is required.
  test-ids:
    description: 'Comma-separated list of test IDs to run.'
    required: false
  tags:
    description: 'Comma-separated list of tags. Tests matching any tag will run.'
    required: false
  tags-query:
    description: 'Tag query expression for advanced filtering. Not supported with mode: ai-sdet.'
    required: false

  # AI SDET only (mode: ai-sdet)
  tests-repo:
    description: |
      Git https URL of the repo holding the pytest files. Optional — defaults to
      the repo configured on your organisation. Only used with mode: ai-sdet.
    required: false
  use-physical-device:
    description: |
      Run on physical devices instead of simulators/emulators. Optional —
      defaults to your organisation setting. Only used with mode: ai-sdet.
    required: false
  tunnel-name:
    description: |
      Name of a MobileBoost Local tunnel, so the app under test can reach
      services inside your own network. Take it from the setup-local-tunnel
      action's output, or its MOBILEBOOST_TUNNEL_NAME variable.

      Requires mode: ai-sdet. The gpt-driver path runs on a third-party device
      cloud that a tunnel cannot reach, and passing this there is an error
      rather than a silent no-op.
    required: false

  # Run configuration (mode: gpt-driver only)
  iterations:
    description: 'Number of iterations (suite runs) to create. This action tracks only the first.'
    required: false
  launch-params:
    description: 'JSON object of launch parameters passed to the app.'
    required: false
  device-provider-settings:
    description: 'JSON object of device provider settings.'
    required: false
  test-inputs:
    description: 'JSON object of test inputs.'
    required: false
  device-configs:
    description: 'JSON array of device configurations.'
    required: false
  metadata:
    description: 'JSON object of arbitrary metadata attached to the run.'
    required: false

  # Action behavior
  async:
    description: 'If true, return immediately after triggering. If false, poll until completion.'
    required: false
    default: 'true'
  timeout-minutes:
    description: 'Max time to wait in sync mode.'
    required: false
    default: '180'
  fail-on-test-failure:
    description: 'If true (default), fail the action when any test fails or is blocked.'
    required: false
    default: 'true'
  api-url:
    description: 'Override the MobileBoost API base URL.'
    required: false
    default: 'https://api.mobileboost.io'
outputs:
  run-id:
    description: 'The ID of the triggered run.'
  passed:
    description: 'Number of passed tests (sync mode only).'
  failed:
    description: 'Number of failed tests (sync mode only).'
  blocked:
    description: 'Number of blocked tests (sync mode only).'
runs:
  using: 'node24'
  main: 'dist/index.js'
