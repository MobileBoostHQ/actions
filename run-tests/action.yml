name: 'MobileBoost — Run Tests'
description: 'Trigger a test run on MobileBoost against an uploaded build.'
author: 'MobileBoost'
branding:
  icon: 'play-circle'
  color: 'purple'
inputs:
  api-key:
    description: 'MobileBoost API key (mb_live_…). Store as a GitHub secret.'
    required: true
  organisation-id:
    description: 'Your MobileBoost organisation ID.'
    required: true
  build-id:
    description: 'Build ID from the upload-build action output.'
    required: true
  platform:
    description: 'Platform: ios or android. Optional; inferred from the build if omitted.'
    required: false

  # Test selection — at least one of test-ids, tags, or tags-query is required.
  test-ids:
    description: 'Comma-separated list of test IDs to run.'
    required: false
  tags:
    description: 'Comma-separated list of tags. Tests matching any tag will run.'
    required: false
  tags-query:
    description: 'Tag query expression for advanced filtering.'
    required: false

  # Run configuration
  iterations:
    description: 'Number of iterations (suite runs) to create. This action tracks only the first.'
    required: false
  launch-params:
    description: 'JSON object of launch parameters passed to the app.'
    required: false
  device-provider-settings:
    description: 'JSON object of device provider settings.'
    required: false
  test-inputs:
    description: 'JSON object of test inputs.'
    required: false
  device-configs:
    description: 'JSON array of device configurations.'
    required: false
  metadata:
    description: 'JSON object of arbitrary metadata attached to the run.'
    required: false

  # Action behavior
  async:
    description: 'If true, return immediately after triggering. If false, poll until completion.'
    required: false
    default: 'false'
  timeout-minutes:
    description: 'Max time to wait in sync mode.'
    required: false
    default: '60'
  fail-on-test-failure:
    description: 'If true (default), fail the action when any test fails or is blocked.'
    required: false
    default: 'true'
  api-url:
    description: 'Override the MobileBoost API base URL.'
    required: false
    default: 'https://api.mobileboost.io'
outputs:
  run-id:
    description: 'The ID of the triggered run.'
  passed:
    description: 'Number of passed tests (sync mode only).'
  failed:
    description: 'Number of failed tests (sync mode only).'
  blocked:
    description: 'Number of blocked tests (sync mode only).'
runs:
  using: 'node20'
  main: 'dist/index.js'
